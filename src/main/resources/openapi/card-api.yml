openapi: 3.0.3
info:
  title: Card API
  version: 1.1.0
  description: |
    API for the debit cards of the bank and the bank accounts linked to them.

    Card Service keeps no money and runs no payment. A debit card points at one or more bank
    accounts of its holder: the main account and, after it, the others in the order they were
    linked. Payments with the card are requested from Transaction Service
    (POST /api/v1/transactions/card-payments), which asks this service which accounts the card
    uses and charges the main account first and, when it has no funds, the next ones in order.

    Linking an account is asynchronous. The request is answered at once with 202 and Account
    Service is asked, through the event broker, whether the account exists and belongs to the
    customer of the card. The result is read with GET /api/v1/cards/{cardId}:
    - A new card is PENDING_VERIFICATION until its first account is confirmed. Then it is
      ACTIVE; when Account Service refuses the account the card is REJECTED, with the reason.
      A card is a product the customer acquires, so Account Service also refuses it when the
      customer is not active (CUSTOMER_INACTIVE) or has overdue debt in a credit product
      (OVERDUE_DEBT).
    - An account added later is PENDING until it is confirmed (LINKED) or refused (REJECTED,
      with the reason). The card stays ACTIVE either way.
    A question that gets no answer is sent again until it is answered.

    A customer can have a limited number of cards (three unless the bank configures another
    limit). Cards that were REJECTED or CANCELLED do not count.

    A card is deleted with DELETE /api/v1/cards/{cardId}, which cancels it for good: the card
    stays readable as CANCELLED, cannot pay and takes no more changes.

    The card number has 16 digits and is never returned whole: responses show its last four.
    Instants are UTC.
servers:
  - url: /
tags:
  - name: Cards
    description: Debit cards and their linked accounts.
paths:
  /api/v1/cards:
    post:
      tags: [Cards]
      operationId: issueCard
      summary: Issue a debit card on a bank account
      description: |
        Records the card with its main account and starts the check of the account. The
        customer and the account are not checked here: Account Service confirms or refuses
        that the account belongs to the customer, and the result is read from the card.

        A customer who already has the maximum number of cards (not counting the REJECTED
        and the CANCELLED ones) is refused at once with 422 CARD_LIMIT_REACHED and nothing is
        recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCardRequest'
            example:
              customerId: 7c1e2d3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
              mainAccountId: 3f2a9c1e-5b7d-4e8f-9a0b-1c2d3e4f5a6b
      responses:
        '202':
          description: The card was recorded and its main account is being checked.
          headers:
            Location:
              description: Where to read the card.
              schema:
                type: string
              example: /api/v1/cards/9b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/CardLimitReached'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Cards]
      operationId: listCards
      summary: List cards using bounded pagination
      description: |
        Newest first. Pages are not snapshots; out-of-range pages return empty items.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: customerId
          in: query
          description: Returns the cards of this customer.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Card page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      tags: [Cards]
      operationId: getCard
      summary: Read a card and its linked accounts
      responses:
        '200':
          description: The card in its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Cards]
      operationId: cancelCard
      summary: Cancel the card for good
      description: |
        The card becomes CANCELLED, whatever its status was, and never leaves that status. It
        stays readable with its accounts, cannot pay, takes no more changes (422
        CARD_CANCELLED) and no longer counts toward the limit of cards of the customer.
        Cancelling a card that is already cancelled changes nothing and is answered 204 too.
      responses:
        '204':
          description: The card is CANCELLED.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/cards/{cardId}/accounts:
    parameters:
      - $ref: '#/components/parameters/CardId'
    post:
      tags: [Cards]
      operationId: linkAccount
      summary: Link another bank account to the card
      description: |
        Adds the account after the ones already linked and starts its check. An account whose
        link was REJECTED can be linked again: the new attempt replaces the rejected one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
            example:
              accountId: 8d7c6b5a-4f3e-4d2c-8b1a-0f9e8d7c6b5a
      responses:
        '202':
          description: The account was added as PENDING and is being checked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '409':
          $ref: '#/components/responses/AccountAlreadyLinked'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/RuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/cards/{cardId}/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/CardId'
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Cards]
      operationId: unlinkAccount
      summary: Unlink a bank account from the card
      description: |
        Removes the account whatever the state of its link. The main account cannot be
        removed: choose another main account first.
      responses:
        '204':
          description: The account is no longer linked to the card.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: The card does not exist (CARD_NOT_FOUND) or the account is not linked to it (ACCOUNT_NOT_LINKED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/RuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/cards/{cardId}/main-account:
    parameters:
      - $ref: '#/components/parameters/CardId'
    put:
      tags: [Cards]
      operationId: changeMainAccount
      summary: Choose the main account of the card
      description: |
        The account must already be LINKED to the card. The previous main account stays
        linked, in the position it had.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
            example:
              accountId: 8d7c6b5a-4f3e-4d2c-8b1a-0f9e8d7c6b5a
      responses:
        '200':
          description: The card with its new main account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/RuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/cards/{cardId}/block:
    parameters:
      - $ref: '#/components/parameters/CardId'
    post:
      tags: [Cards]
      operationId: blockCard
      summary: Block the card
      description: |
        A blocked card cannot pay. Blocking a card that is already blocked changes nothing.
      responses:
        '200':
          description: The card, BLOCKED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '422':
          $ref: '#/components/responses/RuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/cards/{cardId}/unblock:
    parameters:
      - $ref: '#/components/parameters/CardId'
    post:
      tags: [Cards]
      operationId: unblockCard
      summary: Unblock the card
      description: Unblocking a card that is already active changes nothing.
      responses:
        '200':
          description: The card, ACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '422':
          $ref: '#/components/responses/RuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Zero-based page number.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 10000
        default: 0
    Size:
      name: size
      in: query
      description: Maximum number of items per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Malformed JSON, invalid UUID, or invalid field or parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_REQUEST
            message: 'Invalid or missing fields: mainAccountId.'
            timestamp: '2026-11-20T15:00:00Z'
            path: /api/v1/cards
    CardNotFound:
      description: The card does not exist (CARD_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: CARD_NOT_FOUND
            message: The card does not exist.
            timestamp: '2026-11-20T15:00:00Z'
            path: /api/v1/cards/9b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
    AccountAlreadyLinked:
      description: The account is already linked to the card or being checked (ACCOUNT_ALREADY_LINKED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ACCOUNT_ALREADY_LINKED
            message: The account is already linked to the card.
            timestamp: '2026-11-20T15:00:00Z'
            path: /api/v1/cards/9b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d/accounts
    RuleViolation:
      description: |
        A rule of the card does not allow the change:
        - CARD_NOT_ACTIVE: the card is pending, rejected or blocked.
        - CARD_CANCELLED: the card was cancelled and takes no more changes.
        - ACCOUNT_NOT_LINKED: the account chosen as main is not LINKED to the card.
        - MAIN_ACCOUNT_REQUIRED: the main account cannot be unlinked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: CARD_NOT_ACTIVE
            message: The card is not active.
            timestamp: '2026-11-20T15:00:00Z'
            path: /api/v1/cards/9b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d/accounts
    CardLimitReached:
      description: The customer already has the maximum number of cards, not counting the REJECTED and the CANCELLED ones (CARD_LIMIT_REACHED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: CARD_LIMIT_REACHED
            message: The customer already has the maximum number of cards.
            timestamp: '2026-11-20T15:00:00Z'
            path: /api/v1/cards
    UnsupportedMediaType:
      description: The request body is not application/json (UNSUPPORTED_MEDIA_TYPE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected failure (INTERNAL_ERROR). The response never exposes internals.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    IssueCardRequest:
      title: IssueCardRequest
      type: object
      additionalProperties: false
      required: [customerId, mainAccountId]
      properties:
        customerId:
          type: string
          format: uuid
          description: Customer who will hold the card.
        mainAccountId:
          type: string
          format: uuid
          description: Bank account of that customer the card charges first.
    AccountRequest:
      title: AccountRequest
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId:
          type: string
          format: uuid
          description: Bank account of the customer of the card.
    CardResponse:
      title: CardResponse
      type: object
      required: [id, customerId, maskedNumber, status, mainAccountId, accounts, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        maskedNumber:
          type: string
          description: The card number with only its last four digits visible.
          example: '**** **** **** 4821'
        status:
          $ref: '#/components/schemas/CardStatus'
        mainAccountId:
          type: string
          format: uuid
          description: Account the card charges first.
        accounts:
          type: array
          description: The accounts of the card in the order they were linked.
          items:
            $ref: '#/components/schemas/LinkedAccount'
        rejection:
          $ref: '#/components/schemas/Rejection'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: When the card or one of its accounts last changed.
    LinkedAccount:
      title: LinkedAccount
      type: object
      required: [accountId, position, main, status, linkedAt]
      properties:
        accountId:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
          description: Order the account was linked in, starting at 1.
          example: 1
        main:
          type: boolean
          description: Whether it is the main account of the card.
        status:
          $ref: '#/components/schemas/LinkStatus'
        currency:
          type: string
          description: Currency of the account. Present once the account is LINKED.
          example: PEN
        rejection:
          $ref: '#/components/schemas/Rejection'
        linkedAt:
          type: string
          format: date-time
          description: When the link was requested.
    Rejection:
      title: Rejection
      type: object
      description: >-
        Why Account Service refused the account. Present when the status is REJECTED, and on a
        CANCELLED card that was rejected before.
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Error code of Account Service, such as ACCOUNT_NOT_FOUND, ACCOUNT_NOT_OWNED,
            CUSTOMER_INACTIVE or, for a new card only, OVERDUE_DEBT.
          example: ACCOUNT_NOT_OWNED
        message:
          type: string
          example: The account does not belong to the customer.
    CardPageResponse:
      title: CardPageResponse
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CardResponse'
        page:
          type: integer
          format: int32
          example: 0
        size:
          type: integer
          format: int32
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 1
        totalPages:
          type: integer
          format: int64
          description: Ceiling of totalElements divided by size; zero when there are no matches.
          example: 1
    ErrorResponse:
      title: ErrorResponse
      type: object
      required: [code, message, timestamp, path]
      properties:
        code:
          type: string
          description: Stable machine-readable error identifier.
          example: CARD_NOT_FOUND
        message:
          type: string
          description: Human-readable explanation of the error.
          example: The card does not exist.
        timestamp:
          type: string
          format: date-time
          example: '2026-11-20T15:00:00Z'
        path:
          type: string
          example: /api/v1/cards/9b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        traceId:
          type: string
          description: >-
            Correlation identifier of the request: the X-Correlation-ID header received, or
            the one generated when it was absent. It is also returned in that header and
            written in the logs of every service the request reached, including the question
            sent to Account Service.
    CardStatus:
      title: CardStatus
      type: string
      enum: [PENDING_VERIFICATION, ACTIVE, REJECTED, BLOCKED, CANCELLED]
    LinkStatus:
      title: LinkStatus
      type: string
      enum: [PENDING, LINKED, REJECTED]
